name: 模块

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 离线测试
        run: node --test test/main.test.cjs
  module:
    uses: guoapp-modules/.github/.github/workflows/module.yml@main
    permissions:
      contents: write
